schema_version = 1

[device]
name = "dby_w09"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "Huawei MatePad 11 (DBY-W09, kona) runs iPadOS 17.7.11 with the donor identity iPad7,1 / j120ap. The board owns its partition geometry, defconfig, boot package and build recipes; XNU, driver and kit implementations come from the shared tree. This record states what is implemented, what has been observed on hardware and what is still missing."

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "feeds.toml", "unixnu.lock", "configs/**", ".gitignore", ".gitattributes", "local.toml.example", "porting.toml", "AGENTS.md", "README.md"]
inputs = ["iPadOS 17.7.11 build 21H461 for iPad7,1 (chip_id 0x8011, board_id 12, device_class j120ap).", "Shared hardware description and drivers resolve through [components] plus the two feeds in feeds.toml: the sm8250 SoC feed and the ShengUfs driver replacement.", "One defconfig, configs/dby_w09_defconfig, named by board.toml [kernel] defconfig."]
configuration = ["board.toml sets schema_version = 2, so the profile layers, dts/, the SoC repository and patch_series are read as format 2.", "[board] kit = dby_w09 maps package/ to kits/dby_w09 in the assembled tree.", "[ipsw] pins the restore URL, identity and two root-image member hashes; [userdata] records the userdata GPT entry; [device_tree] selects dts/dby_w09.dts with the SoC include directory, and scripts/unixnu/devicetree.py generates the ADT.", "feeds.toml pins two sources beyond the base repository: kind = soc sm8250 (FFT-infra/UniXNU-sm8250-common) and kind = driver ShengUfs (FFT-infra/NativeUfs-alioth, the SM8250 stream of the same driver). ./unixnu fetch clones both at their pinned commits and records them, with every Apple reference source and edk2, in unixnu.lock. Machine paths belong to the ignored local.toml or --local-module."]
procedure = ["Read https://unixnu.com/porting/device-repository and https://unixnu.com/porting/records.", "From the UniXNU checkout run ./unixnu defconfig dby_w09_defconfig -D ../UniXNU-dby_w09, then ./unixnu status --json -D ../UniXNU-dby_w09 and ./unixnu tree -D ../UniXNU-dby_w09.", "Check that every printed module source is the intended one before building."]
findings = ["Editing configs/*_defconfig alone is inert: the kernel build reads the generated out/dby_w09/.config, so defconfig must run again after every defconfig change.", "The donor identity is not a free choice. Prelink, ADT, PMGR contract and Metal inputs are written against iPad7,1 / 21H461, the only combination with an official qualified reference; another donor means redoing target adaptation from scratch.", "An untracked local copy of the shared tree accumulates board-specific edits silently. Every module that the board build depends on must be named here, otherwise this repository cannot reproduce the kernel (see README Deviations)."]
completion = ["Status resolves without error, every referenced file exists in the repository, and no personal path is required to build."]
limits = ["./unixnu status calls any local.toml module override unpinned, so the reproducibility verdict only holds for the published shape: a machine that adds a local.toml prints not reproducible for this same commit."]
next_action = ["Re-run status after any profile, source pin or defconfig change and record the effective module list."]

