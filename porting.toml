[[area]]
id = "firmware"
status = "device-verified"
components = []
paths = ["scripts/check-dby_w09.py", "proprietary-files.txt"]
inputs = ["Mu-Silicium based UEFI tree exposing Platforms/Huawei/dby_w09Pkg/dby_w09.dsc and Resources/Configs/dby_w09.toml.", "EDK II base packages and the DarwinBoot driver package, resolved from the build tree.", "Stock Huawei boot image: the panel, the three physical keys and USB device mode are already usable at the firmware level."]
configuration = ["board.toml [firmware] records config = dby_w09, the DSC path, Build/dby_w09Pkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd, preflight scripts/check-dby_w09.py and the PACKAGES_PATH list.", "[firmware.defines] sets DEVICE_MODEL = dby_w09, ENABLE_SECUREBOOT = 1, MEMORY_PROTECTION = TRUE and SHIP_MODE = FALSE."]
procedure = ["Build the firmware in its own tree, then pass the checkout to the payload build with --uefi.", "Boot the tablet into fastboot from that firmware and flash the payload; read the screen state after each attempt."]
findings = ["The firmware handoff is what makes XNU visible: the GOP framebuffer and the entry-argument HOB are consumed by the legacy display backend, so a display failure is usually a firmware-side reservation problem, not a driver problem.", "This checkout is an offline derivative installed by its own script, so ./unixnu build firmware is not wired to it yet; [firmware] states the intended paths and the build is run by hand.", "The device enters fastboot from the UEFI port, which is the only supported way to write the payload partition.", "The panel's Error: Image at <address> start failed: Not Found, followed by USB boot desired, but no USB devices found on first attempt, is Mu BDS walking its default boot sequence, not a UniXNU failure. MsBootPolicy is a boot-option application and returns the boot-policy status; Silicium's MsBootPolicyLibGetBootSequence returns EFI_UNSUPPORTED, so the library falls back to HDD, USB and PXE, and the USB step fails because no USB disk is attached. The address is EDK2's reused boot-option image buffer and identifies nothing. Silencing it means implementing that library class and reflashing the firmware partition, so the message is documented instead of worked around."]
completion = ["The firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["Firmware build products are not reproducible from this repository alone until the tree becomes a standard uefi-dby_w09 repository."]
next_action = ["Move the firmware port into a standard device firmware repository and enable ./unixnu build firmware with the pinned submodule list."]

