configuration = ["[kernel.prelink] roots already include com.apple.iokit.IOHIDFamily and com.apple.iokit.IOHIDEventDriver, so the OS side of HID is inside the prelink closure.", "[payload] kernel_args reserve offline-hid-input=1, offline-hid-home=1 and offline-key-events=1 for the board producer that is not written yet."]
procedure = ["Read https://unixnu.com/porting/input completely before writing board code: transport and sensor, publishing reports through the qualified IOHIDDevice ABI, then physical buttons.", "Port the shared HID driver against a qualified prelinked candidate and add a board probe that emits a Home report."]
findings = ["The kernel currently contains no HID producer, so the lock screen cannot be dismissed: this is the blocker that separates the presented frame from the desktop.", "Publishing reports means subclassing the original IOHIDDevice with its exact 207-slot vtable and 0xd0 instance size; an approximate header changes the instance layout and the failure appears far from its cause.", "Reusing the SM8550 board's SPI and touch-controller sources without checking the SM8250 controller is the obvious trap on this line."]
completion = ["A touch or key event reaches SpringBoard and the lock screen can be dismissed on hardware."]
limits = ["No touch firmware, no sensor descriptor and no HID event driver is present in this repository yet."]
