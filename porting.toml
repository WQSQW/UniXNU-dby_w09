[[area]]
id = "device-tree"
status = "host-verified"
components = []
paths = ["dts/dby_w09.dts", "soc:dts/sm8250.dtsi", "board.toml", "unixnu.lock"]
inputs = ["Board memory, enabled CPUs and enabled peripherals in the board DTS; controller registers and interrupt geometry in the SoC DTSI.", "[device_tree] source = device:dts/dby_w09.dts with include_dirs = soc:dts, so the dtsi comes from the sm8250 feed pinned in feeds.toml and recorded in unixnu.lock, not from a sibling checkout.", "OS profile property tables and the payload handoff switches in board.toml [payload.adt]."]
configuration = ["dtc compiles the two sources into device-tree/hardware.dtb and scripts/unixnu/devicetree.py encodes kernel.macho.adt; the hand-written format 1 generator is retired.", "The memory node needs two size cells because the root declares #size-cells = <2>: the tested unit's 6 GiB is reg = <0 0x80000000 1 0x80000000>."]
procedure = ["The build compiles the DTS itself with the include directory resolved from [device_tree] include_dirs = soc:dts; the manual equivalent is dtc -I dts -O dtb -i <sm8250 feed checkout>/dts -o /tmp/dby_w09.dtb dts/dby_w09.dts, and the checkout is the one ./unixnu fetch creates for the pinned commit.", "The core's scripts/make-adt.py converts that DTB with --os-profile profiles/os/ipados-17.7.11-21H461/profile.toml --board board.toml --unique-chip-id HEX --data-ramdisk --trust-cache into kernel.macho.adt; devicetree.py and make-adt.py both live in the core checkout, not in this repository.", "Decode both the generated and the hardware-proven ADT and diff them node by node; random-seed and boot-manifest-hash are excluded because the generator writes a fresh seed each run."]
findings = ["The hardware-proven ADT lives inside the flashed payload image, not as a loose file, so the golden copy is extracted from the FAT volume with mcopy.", "/arm-io children are exported as offsets from the window base that arm_io_window() derives from the lowest register it can see, so a different base between two ADTs is not a different physical address.", "ephemeral-storage is published by the converter whenever --data-ramdisk is passed and persistent_data is absent; the hardware-proven image carries it, so the board must not set persistent_data for a reproduction run.", "The memory node makes the board device tree per-unit data too: it carries the tested unit's 6 GiB, so an 8 GiB unit compiles a different reg against a matching board.toml dram_size."]
completion = ["The official converter alone produces an ADT that differs from the hardware-proven one only in the rows recorded as limits."]
limits = ["The common generator emits no /pram node and no /chosen/embedded-panic-log-size, so check_for_panic_log() maps nothing; this is the same gap the official alioth board records, and the panic evidence channel on this board is the panic_screen text instead.", "/chosen/boot-uuid was a format 1 extra: IOKitBSDInit.cpp consumes root-matching first and only falls through to boot-uuid when it is absent, so the official output needs no substitute.", "One contiguous DRAM range is all the handoff supports, so the board declares the 6 GiB that was measured on hardware; an 8 GiB unit of this same model, or a larger reservation on this one, requires that tablet's own device tree as the source, not a hand-set number."]
next_action = ["Re-record the DRAM extent and the enabled peripheral registers from the tablet's own Android device tree once the payload flashes from the official chain."]

