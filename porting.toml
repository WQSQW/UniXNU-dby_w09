[[area]]
id = "power"
status = "host-verified"
components = []
paths = ["package/ShengPlatformPower.cpp", "scripts/build-platform-power.py"]

inputs = ["ApplePMGR from the donor kernelcache (original __TEXT_EXEC hash 2c433279d004…).", "SM8250 PMGR/regulator contract as reached by the shared board scripts.", "The payload's native-ufs-root gate, which demands exactly one sheng-pmgr=2 and a linked _sheng_pmgr_run."]
configuration = ["[kernel] archives runs scripts/build-platform-power.py after the driver recipes so the audit reads the original kernelcache from the pinned cache.", "[payload] kernel_args set sheng-pmgr=2."]
procedure = ["Build the kernel and let the payload build assert the PMGR gate; then boot and read whether AMFI's PMGR dependency holds on hardware.", "Record the contract audit output (extent hashes) with the build, because a mismatch is upstream refusing the input rather than a local error to bypass."]
findings = [
  "The PMGR bridge is still the accepted sheng implementation: the second `build kernel` pass links the real `_sheng_pmgr_run` and `./unixnu build payload` for `09c3aad6…` accepted it on this board, which is the gate that rejects a kernel without that symbol.", "The AMFI/PMGR pairing is a hard gate with a clear failure: without ApplePMGR in the roots the contract audit cannot take its extent and the platform-power archive is never produced, so the payload refuses the image.", "Regulator votes themselves are not yet modelled for kona; the verified part is the contract and the payload gate, which is why this area is host-verified rather than device-verified."]
completion = ["The audit, the archive and the payload gate pass, and the device boots with the PMGR provider registered."]
limits = ["No frequency, idle or charger policy is implemented; battery reporting is not ported."]
next_action = ["Add a device checkpoint for the regulator path once the boot is repeatable."]

