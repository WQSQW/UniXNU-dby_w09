[[area]]
id = "storage"
status = "device-verified"
components = ["ShengUfs", "VirtioMmioBlock", "RamBlock", "SoftwareAES", "AppleKeyStoreState", "VerifiedRoot"]
paths = ["README.md", "scripts/build-link-stubs.py", "package/BootWatchdogPolicy.c", "package/KeyStoreProbe.cpp", "scripts/*storage*", "scripts/*root*", "scripts/*userdata*"]

inputs = ["UFS on LUN 0 with 4096-byte logical blocks; this model ships with 128 or 256 GiB and the tested unit has 128 GiB, so the capacity is read from the device instead of assumed.", "Backup GPT read from a full 9008 dump: the userdata entry spans first_lba 0x29B600 to last_lba 0x1D455FF, i.e. 27,959,296 blocks = 114,521,276,416 bytes.", "fastboot in the same session reports the userdata partition size as 0x14651E0000 = 87,595,810,816 bytes, so the two sources disagree and neither number is used to write anything.", "OS and Cryptex1,SystemOS root images, mounted read-only as disk windows.", "A scratch Data volume seed carrying the writable /private/var."]
configuration = ["[userdata] records the two windows and the LBA range read from the backup; nothing about the geometry is estimated.", "[kernel.prelink] roots keep com.apple.filesystems.apfs and com.apple.iokit.IOStorageFamily, so offline-apfs-load=1 can resolve the identifier it loads.", "[payload.adt] root_match_volume_uuid and packed_data_ramdisk = true describe the delivered form; CONFIG_XNU_OWNER_DATA_VOLUME_UUID in the defconfig must equal the seed's volume UUID.", "The selected components split by role: ShengUfs drives the UFS host on hardware, RamBlock backs the packed Data seed as a block device, VirtioMmioBlock is the root block device of the offline harness, AppleKeyStoreState publishes the key-store events userspace waits for (package/KeyStoreProbe.cpp, sheng-aks=1), VerifiedRoot carries the OS and SystemOS root trust and SoftwareAES is chosen because no Qualcomm crypto engine driver is ported."]
procedure = ["Build the kernel, then the payload with --data-ramdisk, flash the payload partition and read the Data mount checkpoint.", "For a seed produced by the official fixture workflow, verify the packed form against [payload.adt] packed_data_ramdisk before blaming the driver."]
findings = ["The payload partition choice is a capacity fact, not a preference: the official kernel image is 119 MiB and the cache partition is 104 MiB, so the payload lives in the preload partition. userdata is never imaged because it holds the tablet's own iPadOS root volume.", "A missing or mismatched Data seed is unambiguous: native_ram_block_volume_seed() fails, kern_exec reports the mount error and the boot stops. Growing an existing seed keeps the volume UUID and needs only a payload rebuild; a fresh fixture changes it and forces a kernel rebuild.", "Persistent Data (sheng-data-persist=2) writes every dirty page through the UFS store. It eventually fills its own container and the next write returns ENOSPC, which surfaces as a watchdog-policy panic; sheng-data-reset=1 starts the overlay over.", "Copying the fixture onto a dense container instead of a packed one only moves the failure: the loader stalls on the read instead of the kernel stalling on allocation.", "UFS capacity is a per-unit input the same way: 128 and 256 GiB units exist, so the userdata range in board.toml is this unit's backup table and is never a number to carry to another device."]
completion = ["Root and Data volumes mount on hardware, the overlay survives a reboot and no partition other than the payload partition is written."]
limits = ["The UFS geometry is read from a backup of the factory table rather than from the running device tree, and no vendor UFS calibration blob is used.", "The recorded userdata range belongs to the 128 GiB unit this record was measured on; a 256 GiB unit has a different table and has to be read before anything is written."]
next_action = ["Record the store capacity and wear counters of the overlay once the boot is repeatable."]

