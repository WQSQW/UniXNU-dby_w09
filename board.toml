# 板级描述：华为 MatePad 11（DBY-W09，Qualcomm SM8250 / kona）。
#
# format 2（docs/porting/device-repository.md）：解析器按 arch → soc → os → device 四层读取，
# 表按键合并、普通数组覆盖继承值。因此凡是 OS profile
# （profiles/os/ipados-17.7.11-21H461/profile.toml）已经给出的值，这里一律不再重写：
# [ipsw] + [ipsw.sha256]、整个 [kernel.prelink]（tool/kernel/slide/early_security_init/
# kernelcache_sha256/31 项 roots）、[payload] trust_cache_sha256 与 text_fixups、
# 以及 ADT 的 iPad7,1/J120 身份、/chosen 安全状态、/defaults kern.maxvnodes。
# 逐键对拍结果（SAME/DIFF）记在 porting.toml 的 os-profile 区，删的每一行都以那次对拍为据。
# 保留的只有本板实测值，并在旁边写明来源。

schema_version = 2

[board]
name = "dby-w09"            # catalog slug: sync-devices.py SLUG = [a-z0-9][a-z0-9-]* rejects "_"
soc = "SM8250"
soc_source = "sm8250"          # feeds.toml 里 kind = "soc" 的那条钉选
os_profile = "ipados-17.7.11-21H461"
description = "Huawei MatePad 11"
kit = "dby_w09"                # 本仓 package/ 在构建树里出现为 kits/dby_w09

# 目录规范 ID（components.toml）。Adreno740/AdrenoMetal 不在这里：SM8250 的 A650
# 没有任何目录组件覆盖（soc:configs/sm8250.config 明写 # CONFIG_XNU_NATIVE_ADRENO is not set），
# 是未移植项，不是省略。ShengHidInput/ShengNovatekTouch/QcomGeniSpi 已经在
# porting.toml 的 input area 里记为 device-verified（真机触摸与按键可用）。QcomXnuUsbDebug 不在这里，但并不是没接：core 的 components.toml 里还没有这条 spec，而 components.toml 只从 core 软链，设备仓不能添加组件规格。它的归档走 [kernel] archives 的脚本位（scripts/build-qcom-usb-debug.py），模块放在本仓 package/ 里 （构建树里的 kits/dby_w09/QcomXnuUsbDebug，和 DbyTouch 同一层：components.py:resolve 只保留 refer/patch/package/script 加目录选中的组件，设备仓 drivers/ 下没有目录规格的模块会被丢掉），补丁走 [kernel] patch_series 的第五条 device:patches/xnu/series-usb。
[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "ShengUfs", "VirtioMmioBlock", "RamBlock", "GopFramebuffer", "XnuPrelink", "DarwinBoot", "AppleKeyStoreState", "VerifiedRoot", "ShengHidInput", "ShengNovatekTouch", "QcomGeniSpi"]

# ---------------------------------------------------------------------------
# userdata：已取证（9008 完整备份 gpt_main0.bin，LUN 0）。
#   GPT header @ LBA 8 (offset 4096)，分区项 128B/条，num_parts=64。
#   userdata 条目：first_lba=2733568 (0x29B600), last_lba=30692863 (0x1D455FF)。
#   LBA 单位 4096 字节（整盘 = 30693376 LBA × 4096 = 117.09 GiB ≈ 128G UFS）。
#   注意：DBY-W09 的内存和存储都不是单一规格（同型号有 6/8 GiB RAM、128/256 GiB UFS）。
#   上面这组 LBA 是本机（128 GiB）备份表里的实测值，换机必须读自己那份 GPT，不能照抄。
#   userdata 容量 = (30692863-2733568+1) × 4096 = 106.66 GiB。
#   这块分区里放着本机的 iPadOS 根卷：任何时候都不重新镜像它。
# ---------------------------------------------------------------------------
[userdata]
first_lba = 0x29B600
last_lba = 0x1D455FF
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

# ---------------------------------------------------------------------------
# kernel：config_fragments 按顺序生效，最后再叠 configs/dby_w09_defconfig，后写覆盖先写。
# patch_series 四层拼接，这里把 device: 放在 os: 之前：sm8250 SoC 仓的 patches/xnu/series
# 是空的，而 arch/os 两层都默认「本板会补上 native-smp-secondary 与 sheng-platform-power」
# （官方 device-records/sirius.toml 对 sdm710 逐字记了这条依赖：sdm710 把它们放在 soc: 层，
# soc: 排在 os: 之前）。zzz-boot-progress.patch 在 os: 层，它的 @@ -773,7 +775,9 @@ hunk
# 把 sheng-platform-power 插入的那段当上下文，git apply 按解析出的顺序硬执行
# （scripts/unixnu/patches.py:prepare），所以 device 层必须排在 os 层之前。详见本仓
# patches/xnu/series 的说明。
#
# archives 顺序 = 内核链接要求的顺序：先产归档，bindings 步骤再把 original 绝对地址对象
# 加进同一个归档（build-xnu-4k-baseline.sh 的 -Wl,-force_load 路径）。
# component:<ID> 展开成目录里该组件的 build 配方（例如 ShengUfs → build-arm-driver.py ShengUfs，
# 产出 build/sheng-ufs/libShengUfs.a）；kernel.py:archive_plan 要求所有 kernel 阶段
# 有配方的组件都在这里出现，缺一个就直接报错。
# 脚本查找顺序是 core → soc → device（scripts/unixnu/tree.py:assemble 的 bases），
# 所以 build-boot-progress / build-link-stubs / build-platform-power /
# build-gop-legacy-display 由本仓 scripts/ 提供是官方分层，不是自制入口。
# ---------------------------------------------------------------------------
[kernel]
defconfig = "dby_w09_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "device:patches/xnu/series", "os:patches/xnu/series",
  # QcomXnuUsbDebug 的两个补丁必须排在 os: 之后：port-sm8250.md §7.3 明写它们在 zzz-boot-progress.patch 之后 apply（PE_init_kprintf 的 hunk 拿
  # boot-progress 插的行当上下文）。patch_series 是数组覆盖，所以这里要重复上面四项。
  "device:patches/xnu/series-usb"]
archives = [
  # arch:configs/common.config 打开 SOURCE_CORECRYPTO14 / SOURCE_PTHREAD，
  # 这两个归档只有这两步会产。
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  # SoftwareAES 是 NATIVE_VIRTIO_BLOCK / NATIVE_RAM_BLOCK 的硬前置
  # （build-xnu-4k-baseline.sh 要求 XNU_NATIVE_AES=1）。bindings 在没有活体审计时
  # 走 scripts/data/native-aes-original-bindings.S 的录制回退（官方行为）。
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  # UFS 传输。feeds.toml 把它钉到带 SM8250 stream 配置的驱动源上。
  "component:ShengUfs",
  # 根设备发布要 NativeUfs 的 IOBlockStorageDevice/IOMedia 未定义符号绑到
  # original kernelcache 的绝对地址。官方 core 只给了 Virtio/RamBlock 的
  # build-virtio-mmio-bindings.py（--component 的 choices 里没有 NativeUfs），
  # 所以这一步由设备仓自带 scripts/build-storage-bindings.py 承担：它读的
  # build/storage-abi/interface-audit.json 是官方 audit-storage-interface.py 在本板
  # 活体取证的产物。记录在 porting.toml 的 storage 区，属于「上游缺配方」而不是「我们绕过」。
  "build-storage-bindings.py --component NativeUfs --archive libShengUfs.a --directory build/sheng-ufs",
  # 策略选择器：导出 native_verified_block_root_authorized()，OWNER_ROOT_AUDIT 调它。
  # VERIFIED_ROOT_PROBE=1 时 build-arm-driver.py 直接把归档写进 virtio-mmio-block-verified-bundle。
  "component:VirtioMmioBlock",
  # 官方入口是 build-virtio-mmio-bindings.py，逐字保留在下面这两行（官方 sheng/board.toml:29-32 的顺序就是 component:VirtioMmioBlock、component:RamBlock、--component RamBlock --directory build/ram-block、--component VirtioMmioBlock）：
  #   "build-virtio-mmio-bindings.py --component RamBlock --directory build/ram-block",
  #   "build-virtio-mmio-bindings.py --component VirtioMmioBlock",
  # 它第 20 行无条件读设备自备的 build/storage-abi/interface-audit.json（docs/porting/migration.md:335 把它列为构建输入），第 27 行还要里面的活体标志；core 里没有任何脚本产它（scripts/unixnu/kernel.py:183 只把 IOStorageFamily 头拷进 build/storage-abi/include），本板活体审计从未跑完（format-1 的 build/storage-abi/ 只剩参考对象与 compile.log）。所以这两步先走设备层录制推导（format-1 硬件验证过的同一份 bindings）让 pass 通，官方活体审计作为发布前必补的门记在 porting.toml 的 storage 区。
  "build-storage-bindings.py --component NativeVirtioBlock --archive libVirtioMmioBlock.a --directory build/virtio-mmio-block --subset",
  # defconfig 把块驱动归档指向 verified bundle（和官方 sheng 的 configs/sheng_defconfig:19 同一形状），
  # 官方入口就是 build-arm-driver.py 的这两个开关（docs/concepts/security.md:57 按容量选择策略包），
  # 产物 build/virtio-mmio-block-verified-bundle/libVirtioMmioBlock.a 由 kernel.py:141 的 *_ARCHIVE 门校验。
  "build-arm-driver.py NativeVirtioBlock --verified-root --verified-root-bundle",
  # defconfig 把 XNU_NATIVE_VIRTIO_BLOCK_ARCHIVE 指向这个 bundle 归档，链接门 build-xnu-4k-baseline.sh:701-709
  # 要求归档旁边有 bindings.json，并按归档名去 lib 前缀后的同名 .o 核对它的 sha256；bundle 里的对象按
  # 运行时类名命名，所以这一步（官方文档 docs/porting/migration.md:330-341 允许设备自带 recipe）补 bindings
  # 记录，并由脚本按同名发布同一份编译产物。产物 build/virtio-mmio-block-verified-bundle/libVirtioMmioBlock.a
  # 同时满足 kernel.py:141 的 *_ARCHIVE 门。
  "build-storage-bindings.py --component NativeVirtioBlock --archive libVirtioMmioBlock.a --directory build/virtio-mmio-block-verified-bundle --subset",
  # 可写 /private/var 必须由 RamBlock 发布真 IOMedia（md0/memdev 路线实测失败：
  # APFS 拒绝挂裸 memdev，内核 panic "offline scratch Data mount failed: 2"）。
  # 官方 baseline 会把这份 bindings.json 和 virtio 的共用 original 符号逐条对拍，
  # 并要求 compiled_object_sha256 对上 NativeRamBlock.o。
  "component:RamBlock",
  "build-storage-bindings.py --component NativeRamBlock --archive libRamBlock.a --directory build/ram-block --subset",
  # payload 的 native-ufs-root 硬门要求内核里有 _sheng_pmgr_run。
  "build-platform-power.py",
  # 双卷（OS + SystemOS）verified-root policy bundle，喂给
  # CONFIG_XNU_VERIFIED_ROOT_ARCHIVE。
  # libVerifiedRootProbe.a 按官方形状自备进构建树（docs/guide/build-kernel.md:108「an archive that no
  # builder makes must be supplied in the build tree」），官方 sheng/alioth 的 archives 里也没有这一步，
  # 只在 configs/sheng_defconfig:20 引用产物。官方命令逐字留着：
  #   "build-verified-root-probe.py --component os --include-systemos",
  # 它在这台机器上跑不动：build-verified-root-probe.py:136 原样复用 bsd_init.o 的编译记录，记录里是
  # -Weverything 且没有 -Wno-unsafe-buffer-usage，官方钉住的 clang-24 因此把 kits/VerifiedRoot/src/
  # verified_root.c 判成 39 个 -Werror；而官方 build-arm-driver.py:66-79 的做法是先剥掉记录里所有 -W
  # 再自带警告集。components.toml:437-453 给 VerifiedRoot 的规格是 build_stage=embedded、build=[]、
  # outputs=[]，core 没有 Linux 侧配方。产物来源：format-1 用同一份 policy（manifest/anchor 的 sha256
  # 已在本脚本对拍）编同一份官方 kit C，那份内核是上过硬件、到过锁屏的。
  # libBootProgress.a：BOOT_PROGRESS 走全局 EXTRA_CFLAGS，同时是屏幕上有
  # 阶段带/pulse 条的开关。它引用的 sheng 专属计数器由下面的 link-stubs 给零值定义。
  "build-boot-progress.py",
  "build-link-stubs.py",
  "build-libpthread-kernel.py",
  "component:ShengHidInput",
  "component:AppleKeyStoreState",
  # legacy 显示后端：NativeLegacyDisplay + NativeGOPPresenter + 板级 probe。
  # 必须在驱动配方之后，因为它读它们的编译记录。
  # 触摸生产者：真机验证过的 DbyTouch（同一型号机子上跑通的实现），产出 build/dby-touch/libDbyTouch.a。
  # 它走 defconfig 的 CONFIG_XNU_EXTRA_LD_ARCHIVES 普通路径，不是 force_load：BootProgress.c 里
  # dby_touch_probe_entry() 是强引用，链接器按未定义符号一定会把它拉进来。
  "build-dby-touch.py",
  "build-gop-legacy-display.py",
  # CDC-ACM 控制台归档：官方入口是组件目录 spec（components.toml:513-534）调模块自己的
  # scripts/build.py，本 core 没有这条 spec 且 components.toml 只从 core 软链（tree.py:assemble），
  # 所以同一条命令放在设备层脚本位。它读 bootstrap pass 留下的 pe_kprintf.o.json。
  "build-qcom-usb-debug.py",
]

# ---------------------------------------------------------------------------
# 设备树：format 2 的硬件描述。板级 DTS 只写硬件（内存、启用的 CPU、外设开关），
# Apple 平台属性在 OS profile 里，板级差异写在下面 [adt.*]。
# dtc 编译与 ADT 生成都由 scripts/unixnu/devicetree.py + scripts/make-adt.py 完成，
# format 1 的自制 scripts/make-dby_w09-adt.py 已退役。
# ---------------------------------------------------------------------------
[device_tree]
source = "device:dts/dby_w09.dts"
include_dirs = ["soc:dts"]

# ---------------------------------------------------------------------------
# firmware：uefi-sheng/UniXNUPkg 派生的 Mu-Silicium 移植（Platforms/Huawei/dby_w09Pkg）。
# 我们的 UEFI 编译链目前在 VM 里手动跑，所以 [firmware] 只是把产物路径写对，
# unixnu build firmware 还不是本板的构建入口——这一点记在 porting.toml 里。
# ---------------------------------------------------------------------------
[firmware]
config = "dby_w09"                 # Resources/Configs/dby_w09.toml
dsc = "Platforms/Huawei/dby_w09Pkg/dby_w09.dsc"
fd = "Build/dby_w09Pkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-dby_w09.py"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Huawei",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Huawei",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "dby_w09"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "dby_w09-research"

# ---------------------------------------------------------------------------
# payload：每个 kernel_arg 旁边的注释写它对应哪一条官方门或哪个补丁代码，删参数前先读那条注释。
# trust_cache_sha256 / text_fixups 不在这里——profile 的两枚原始 bundle 哈希与我们用的完全一致。
# ---------------------------------------------------------------------------
[payload]
volume = "DBYW09ESP"
size_mib = 208       # 带完整 AMFI 闭包的预链接内核放不进 cache 分区
                     # （实测 partition-size:cache = 0x6800000 = 104 MiB），
                     # 所以负载卷刷 preload（0x57800000 = 1368 MiB）。
loader = "firmware"
title = "dby_w09 first boot: source 4K XNU to console"
dram_size = "0x180000000"   # 本机 6 GiB；同型号另有 8 GiB 版本，换机要连同 dts 的
                            # memory reg 一起改。它必须等于 dts/dby_w09.dts 的 memory reg，
                            # 否则 devicetree.py:306 直接报错
skip_setup_tool = "scripts/seed-data-skip-setup.py"
panic_screen = true
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "sheng-smp=1",
  # 触摸驱动阶段梯（package/DbyTouch/DbyTouch.cpp 读 dby-touch=）：8 = 取帧+接触点提取+发布，
  # 并且跑厂商固件下载——这颗 N9Z 是无闪存 THP，主机每次开机不上传 0x30000 镜像就永远不上报。
  # dby-touch-se=1 是单独一道门：本驱动从不做时钟投票，未上电读 SE 会挂死总线（2026-10-31 实测）。
  "dby-touch=8",

  "dby-touch-se=1",
  "sheng-cpufreq=2",
  # DriverKit 必须让开：不加 dk=0 时 AppleUserHIDEventDriver 抢走匹配，然后卡在
  # "user server timeout"（机器上没有 AppleUserHIDDrivers 进程），事件根本出不了内核；
  # 加上它才由内核内的 IOHIDEventDriver 接管这份 collection。
  "dk=0",
  # 官方持久化日志写入器（package/BootLog.c，1070 行向 native_ufs_log_open 要窗口）。
  # 这是朋友套件 §6.1 唯一的取证通道：设备崩溃时没有第二双眼睛，日志窗口自己把那次开机
  # 的每一行留在 userdata 尾部，fastboot oem edl 读满 8192 块后用 04-analyse/decode-thisboot.py 解。
  # 落点安全性是本机实测而非抄来的：board.toml 记的 userdata 区间 first_lba=2733568(0x29B600)
  # last_lba=30692863(0x1D455FF)，日志区是这段的最后 8192 块，距根镜像末界 0x29FBE4 约 106 GiB，
  # 不碰 iPadOS 根卷；与 sheng-data-persist=2 并存是套件验证过的同一配置。
  # 窗口由 native_ufs_log_open() 运行时给出，不是硬编码 LBA；autoreset 写入门（BootResetDby.c）
  # 本仓没有，所以这一版只写不复位。
  "sheng-log=1",
  "sheng-touch-hid=1",
  # 实体按键：PM8150 PON 的 KPDPWR(电源) / RESIN(音量减) + GPIO6(音量加)，
  # 由 DbyTouch.cpp 的按键轮询线程读 RT_STS 后经 report 2 上报。
  "sheng-buttons=1",
  # Separate digitizer service (primary usage Digitizer/Touch Screen, Built-In). Without it the touch
  # collection only rides at the tail of the keyboard descriptor, which backboardd does not consume.
  # sheng-touch-split=1 is off: it builds a second Touch Screen device, native_touch_set_sink() is a single
# global slot so only the last driver instance to start ever publishes, and HidInputProbe.cpp patches the
# Built-In/PrimaryUsage pair onto the first device's event service only - which then has nothing to send.
# alioth board.toml:694-699 and uke TOUCH-PORT.md:41 both record the same reason. sheng-touch-hid=1 above is
# the required half and stays.
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-validate=1",
  "offline-legacy-retire=1",
  "boot-progress=2",
  # Read-only DWC3 inheritance probe (2026-11-04), panel rows 43..46.  It prints the
  # GCC USB branches, the USB30 power domain, the block reset and the DWC3 mode,
  # version, DSTS and address width, so one boot answers whether the firmware
  # handover leaves the controller takeable.  It stores nothing: removing this line
  # makes the payload byte-identical to the previous build.
  # The CDC-ACM kernel console over this board's DWC3 (QcomXnuUsbDebug, the same channel the
  # hardware-verified alioth board uses; docs/devices/alioth.md records it as the SM8250 debug
  # route). It tees printf, kprintf, IOLog and the panic drain onto a USB serial port that
  # enumerates as 1209:316d "QcomXnuUsbDebug", so the touch rows and stage counters arrive as
  # text on the host instead of as a photograph of the diagnostic page.
  # REMOVED 2026-11-01. This was the only USB-related difference between the current payload and
  # f2-payload-461538fa (the format-2 payload that never hung when the cable was pulled), and the
  # official hazard note spells out the failure mode: qcom_usb_debug_write() polls the DWC3
  # (poll_owned(), plus a 1 ms flush window in diag mode). The console never enumerated on the
  # host either (no 1209:316d), so every tee'd printf/kprintf/IOLog has been polling a controller
  # that never came back -- and when the cable is pulled the poll has no owner left to find.
  # Evidence: community-components/alioth-qud/docs/evidence/2026-10-27-boot-diagnostics.md
  # sheng-build-tag removed here: it is the panel session label, and package/BootProgress.c:213
  # states its purpose as "so a photograph says which image it is". The USB console now carries
  # the record itself, and each run is named by the kernel sha256 that payload.json records, so
  # this row had no reader left. Its 21 bytes are also the reserve for qcom-usb-ctl=1, which is
  # the documented next step and would otherwise not fit under the 1000-byte gate
  # (payload.py:35, DarwinBoot's 1024-byte command-line buffer).
  "offline-apfs-load=1",
  "offline-mobile-graphics-load=1",
  "-apfs_shared_datavolume",
  # NativeUfs 默认 stream 0x60 是 sheng 的板子；SM8250 走 0x0e0 / 0x4e0。
  "native-ufs-stream=0xe0",
  "native-ufs-stream2=0x4e0",
  # 根设备发布门（NativeUfs.cpp start()：`if (rootMode && !probe) return startRoot(provider)`）。
  # probe=10 是只读取证，和 root 互斥，所以必须用 root=1，否则永远不发布 IOMedia。
  "native-ufs-root=1",
  # AMFI 硬门：payload.py 见到 native-ufs-root=1 就要求恰好一个 sheng-pmgr=2，
  # 且内核里链了 _sheng_pmgr_run，否则原封不动的目标 AMFI 会 panic "No PMGR"。
  "sheng-pmgr=2",
  # watchdogd 因 Data 卷没有 role 而 BRK #1，com.apple.watchdogd.plist 的 _PanicOnCrash
  # 会把这一下升级成内核 panic。Data 挂载门还没开，所以先按官方 bring-up 做法抑制，
  # 好让 initproc 之后的失败可读。
  "panic_on_crash_disabled=1",
  # 以下每一项都对应本轮从官方 core 补进树里的补丁，参数本身由补丁里的代码读取：
  #  zzyb-native-cryptex-os-view.patch -> 提供 SystemOS cryptex 视图，配合 -apfs_shared_datavolume
  #  zzyc-owner-skip-launch-constraints.patch -> 放宽 launch constraints，让原始 iPadOS 用户态可 exec
  # sheng-staged-apps 关闭：官方 UniXNU-sheng 只有 disable-watchdogd / disable-jobs / data-persist。
  # 开它内核会把 OS 卷约 25 MiB 的 staged_system_apps 复制进 Data 种子，容器放不下，
  # BootWatchdogPolicy.c 写 disabled.plist 得到 ENOSPC 28，内核在 kern_exec.c:8201 panic。
  "kt_fixed_zones=120",
  # offline-legacy-unit-scale=1 发布 /chosen display-scale，SpringBoard 的
  # -[FBSDisplayMode _initWithWidth:height:preferredScale:] 读的就是它。缺它 preferredScale=0，
  # 合法性检查在 FBS+0xf744 触发 brk #0，SpringBoard 永远起不完。上游限定态是
  # unit_scale_calls==chosen_scale==1、unit_scale_status==0；本板早先传 2 时对拍门没过，
  # DISPLAY 停在 8，1 才是官方 GOP 1:1 值。
  # 2026-11-04 00:30: 1 -> 2. At 1 the OS lays out on 1600 x 2560 logical points, so a 10.8" panel
  # renders iPad UI at half size ("UI 太小了", owner report after the touch fix). 2 = 800 x 1280 pt,
  # iPad Pro 11 territory. Touch is published in real pixels and does not depend on this number.
  "offline-legacy-unit-scale=2",
  "offline-legacy-pm=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "offline-legacy-phase=4",
  "offline-mobile-graphics-client=1",
  "offline-hid-home=1",
  "offline-hid-input=1",
  "offline-key-events=1",
  # sheng-aks=1 让 AppleKeyStoreState 的 user client 如实回答状态查询（无钥匙串、未锁定）。
  # 绝不加 offline-keystore=1：两者互斥，KeyStoreProbe.cpp:91 在它存在时直接放弃替身。
  "sheng-aks=1",
  # 官方 debugging 文档：boot-ui-focus 替换第二个采样槽（默认 backboardd）。默认 trace_slot[0]=0，
  # launchd 自身不被追踪；只有 launchd 活着时 boot_ui_trace_ready 永远是 0，UI trace 画不出来。
  "boot-ui-focus=launchd",
  "boot-ui-focus4=SpringBoard",
  "sheng-data-persist=2",
  "sheng-data-reset=1",
  "sheng-disable-watchdogd=1",
  "sheng-disable-jobs=com.apple.identityservicesd,com.apple.locationd,com.apple.CommCenter,com.apple.bluetoothd",
  "armcpu-diagnostics=1",
  # boot-diag-resume=3600：面板要交给系统。取 10 时，只要 UI 连续 10 秒没扫出新内容诊断页就抢回去，
  # 而这对手屏（Always-On）是正常的，于是平板在系统画面和我们那页之间来回。3600 是
  # BootProgress.c:535 接受的最大值。
  "boot-diag-resume=3600",
  "armcpu-spi-ipi=1",
  "-no_slto_panic",
  # port-sm8250.md §7.7：qcom-usb-debug=1 单独加、加在最后，一次刷写只回答一个问题。
  # 这是 QcomXnuUsbDebug 唯一的启用开关（kernel/QcomXnuUsbDebug.c 读它）；不加它归档虽然
  # force_load 进来，六个单元的补丁调用点全部保持关闭。qcom-usb-ctl=1（Mac 反向控制）这次
  # 不加：971 + len(" qcom-usb-debug=1") = 988，再加 ctl 是 1003，越过 DarwinBoot 的 1000 字节门
  # （payload.py:35）。主机侧证据是枚举 1209:316d serial=QcomXnuUsbDebug；拒绝也会由
  # boot-progress 把同一行画在面板上（§8），所以一次刷写两边都能读。
  "qcom-usb-debug=1",
]

# ---------------------------------------------------------------------------
# DarwinBoot 交接开关（devicetree.py 的 options = config['payload']['adt']）：
# 只有这五个键属于这里，设备身份和平台默认值写在下面的 [adt.*]。
# ---------------------------------------------------------------------------
[payload.adt]
chip_id = "207"                       # 按 16 位读（devicetree.py:312），与 format 1 同值
owned_memory_size = "0x100000000"     # 4 GiB DarwinBoot 连续窗口；不写就是 256 MiB 默认窗口，
                                      # XNU 只能拿到 256 MiB。同 SM8250 的官方 alioth 取值。
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"   # OS 窗口自己的卷 UUID
unique_chip_id = "required"           # 真值由 --unique-chip-id HEX 传入（每次出镜像的板级种子）
# 内核开了 CONFIG_XNU_NATIVE_RAM_BLOCK，交付的是稀疏 DBRDISK1 种子，ADT 必须写
# PackedRAMDisk；写 RAMDisk 时 DarwinBoot 在 DarwinBoot.c:558 以 EFI_COMPROMISED_DATA 拒收。
packed_data_ramdisk = true
# 可写 Data 卷是本机 userdata 里的持久卷，不是易失夹具 → 不发布 ephemeral-storage。
# persistent_data  deliberately NOT set: the hardware-proven ADT (payload-reset.img,
# adt_sha256 d92b0972) publishes /chosen/ephemeral-storage=1, and devicetree.py:333
# emits it whenever --data-ramdisk is passed and persistent_data is absent. Reproducing
# that boot must not silently change the Data-volume semantics.
# # persistent_data  deliberately NOT set: the hardware-proven ADT (payload-reset.img,
# adt_sha256 d92b0972) publishes /chosen/ephemeral-storage=1, and devicetree.py:333
# emits it whenever --data-ramdisk is passed and persistent_data is absent. Reproducing
# that boot must not silently change the Data-volume semantics.
# persistent_data = true

# ---------------------------------------------------------------------------
# 板级 ADT 覆盖：顶层 [adt.*]（devicetree.py 的 platform = config['adt']），
# 不是 [payload.adt.*]。profiles.merge() 是递归字典合并，逐键盖住 profile 的值。
# 这里只留三组本板实测值，其余身份/安全状态/maxvnodes 全部沿用 profile。
# ---------------------------------------------------------------------------

# /product：机型串按本板；artwork-device-subtype 用本机面板长边 2160，
# 不是 donor iPad Pro 12.9 的 2732；thin-bezel 是 format 1 已验证链上的值。
[adt.product.string]
model = "huawei,dby_w09"

[adt.product.u32]
artwork-device-subtype = 2160
thin-bezel = 1

# 本板没实现 suspend/resume：用原始根域策略输入，而不是让 CPU 永久停车。
[adt.defaults.u32]
sleep-disabled = 1

# /buttons：DBY-W09 没有 Home 键，所以 button-names 不带 menu，
# home-button-type = 2（纯手势），锁屏给滑动解锁并画 home indicator。
[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

# 已知上游缺口（记录，不绕过）：format 2 的公共生成器不产 /pram 节点，也不写
# /chosen/embedded-panic-log-size，所以 pexpert check_for_panic_log() 在
# CONFIG_XNU_DT_PANIC_REGION=y（defconfig 里开着）下走设备树分支、找不到 pram 就直接返回，
# 不映射任何内存。官方 alioth 记的是同一件事（board.toml:196-198、configs/alioth_defconfig:12-19）。
# 本板的 panic 证据通道因此是 panic_screen=true 的屏上文本 + boot_progress_panic_text，
# 不是 RAM 里的 embedded-panic-log。
