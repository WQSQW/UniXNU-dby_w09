  # /home/wqsqw/kernel/drivers/power/supply/qcom/：APSD_STATUS/APSD_RESULT（smb5-reg.h:207/:217）只读
  # 不改；USBIN_CURRENT_LIMIT_CFG 0x1370 = ua/50000（qpnp-smb5.c:143-149 + smb5-lib.c:754）；
  # 三条 override 写按 smblib_icl_override() 的 Huawei 第三方形状（smb5-lib.c:189-196，
  # 由 kona/DBY/common/huawei_charger.dtsi:147 的 usb-thd-bc-12 决定）；解除输入悬挂
  # 0x1340 bit0（:775-777）；回退态是厂商自己的 HW_AUTO_MODE（:203-207）。
  # BC1P2_SRC_DETECT 位不碰——同一个 flag 下 smblib_apsd_enable() 强制关掉 PMIC 自检测
  # （:1005-1010），本机的问题类型由 FSA9685 回答；900 mA 不试，本板 DWC3 钉死 HIGHSPEED
  # （package/QcomXnuUsbDebug/usb/Dwc3.c:533-534），厂商给 USB2 主机端口的就是 500 mA；
  # HVDCP 3000 mA 不试，那要先用 reglit 向适配器要 9 V/12 V，本启动里没有那条协商。
  # 写面有界：最多映射两条 chnls 通道（USBIN 与 MISC 各一），且每条先查 ownership 表的
  # write_ee 是否等于本 EE——不等就是 spmi-pmic-arb.c:1007-1011 的 -EPERM，这里连通道都不映射。
  # 阶梯只在实时状态确认上一档没让输入崩溃（USBIN RT_STS 的 COLLAPSE bit0 / UV bit2，
  # smb5-reg.h:236-239）之后才往上走，塌了退回一档，连 500 mA 都塌就恢复 HW_AUTO 并整轮锁死。
  # 温度在纯读路径上拿不到（gen4 只有 SRAM+IMA 写握手那一条路，qpnp-fg-gen4.c:705-720），
  # 所以那一格仍然是 -1、属性键缺席，不是猜一个数——读不到永远是 unknown，不是 0。
  # 「在不在充电」不由这里发明：本板内核编进去的是华为分支的 smblib_get_prop_batt_status()
  # （smb5-lib.c:2111-2162；merge_kona_defconfig:5912 开了 CONFIG_HUAWEI_POWER_EMBEDDED_
  # ISOLATION=y）= 直充 stage 窗口 / 无线适配器类型 / （usb_present 且 ICL 变化中断未开 且
  # input_suspend 未置位）三者相或，再被 COLD、OVERHEAT、OVERVOLTAGE 改写回不充电，里面没有
  # SMB5 那 3 位调节 stage。原先用的 stage∈[Trickle..Taper] 一遇负载台阶（滑亮度）就被走到
  # INHIBIT/PAUSE 一个采样，图标于是灭了而电芯还在吃电流；现在照厂商那几个输入读，stage 只
  # 留官方给它的用途：说电充满了。
  # 命名按本板 dby- 短名规范（同 dby-bl=1、dby-pa=2），不用官方的 sheng-battery=1（15 字节）。
  # 字节预算：本次改动前实测 44 个参数拼接 919 字节，加这个 933/1000（payload.py:35 的 DarwinBoot 门）。
  "dby-battery=2",
  # 2026-11-07 dby-audio=2（12 字节）：本机 legacy APR 播放阶梯的开关，读取点是 package/DbyAudio.cpp:445
  # 的 sheng_audio_probe（同一条链上 dby-apr 只截阶梯深度，默认 3 = AFE/ADM/ASM 全跑，这次不占字节）。
  # 2 是 initiator：由我们打开 apr_audio_svc 通道并先问 AVCS 版本；1 只被动监听，本机要主动拉起。
  # 不用 SM8550 AudioProbe.cpp 读的 sheng-audio：那是另一台机器的硅，本板不编译它（上面 216-219 行的
  # 命名规范同一规则）。字节预算：加这条前实测 48 个参数拼接 984 字节，加完 996/1000（payload.py:35）。
  "dby-audio=2",
  "qcom-usb-debug=1",
]

# ---------------------------------------------------------------------------
# DarwinBoot 交接开关（devicetree.py 的 options = config['payload']['adt']）：
# 只有这五个键属于这里，设备身份和平台默认值写在下面的 [adt.*]。
# ---------------------------------------------------------------------------
[payload.adt]
chip_id = "207"                       # 按 16 位读（devicetree.py:312），与 format 1 同值
owned_memory_size = "0x100000000"     # 4 GiB DarwinBoot 连续窗口；不写就是 256 MiB 默认窗口，
                                      # XNU 只能拿到 256 MiB。同 SM8250 的官方 alioth 取值。
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"   # OS 窗口自己的卷 UUID
unique_chip_id = "required"           # 真值由 --unique-chip-id HEX 传入（每次出镜像的板级种子）
# 内核开了 CONFIG_XNU_NATIVE_RAM_BLOCK，交付的是稀疏 DBRDISK1 种子，ADT 必须写
# PackedRAMDisk；写 RAMDisk 时 DarwinBoot 在 DarwinBoot.c:558 以 EFI_COMPROMISED_DATA 拒收。
packed_data_ramdisk = true
# 可写 Data 卷是本机 userdata 里的持久卷，不是易失夹具 → 不发布 ephemeral-storage。
# persistent_data  deliberately NOT set: the hardware-proven ADT (payload-reset.img,
# adt_sha256 d92b0972) publishes /chosen/ephemeral-storage=1, and devicetree.py:333
# emits it whenever --data-ramdisk is passed and persistent_data is absent. Reproducing
# that boot must not silently change the Data-volume semantics.
# # persistent_data  deliberately NOT set: the hardware-proven ADT (payload-reset.img,
# adt_sha256 d92b0972) publishes /chosen/ephemeral-storage=1, and devicetree.py:333
# emits it whenever --data-ramdisk is passed and persistent_data is absent. Reproducing
# that boot must not silently change the Data-volume semantics.
# persistent_data = true

# ---------------------------------------------------------------------------
# 板级 ADT 覆盖：顶层 [adt.*]（devicetree.py 的 platform = config['adt']），
# 不是 [payload.adt.*]。profiles.merge() 是递归字典合并，逐键盖住 profile 的值。
# 这里只留三组本板实测值，其余身份/安全状态/maxvnodes 全部沿用 profile。
# ---------------------------------------------------------------------------

# /product：机型串按本板；artwork-device-subtype 用本机面板长边 2160，
# 不是 donor iPad Pro 12.9 的 2732；thin-bezel 是 format 1 已验证链上的值。
[adt.product.string]
model = "huawei,dby_w09"

[adt.product.u32]
artwork-device-subtype = 2160
thin-bezel = 1

# 本板没实现 suspend/resume：用原始根域策略输入，而不是让 CPU 永久停车。
[adt.defaults.u32]
sleep-disabled = 1

# /buttons：DBY-W09 没有 Home 键，所以 button-names 不带 menu，
# home-button-type = 2（纯手势），锁屏给滑动解锁并画 home indicator。
[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

# 已知上游缺口（记录，不绕过）：format 2 的公共生成器不产 /pram 节点，也不写
# /chosen/embedded-panic-log-size，所以 pexpert check_for_panic_log() 在
# CONFIG_XNU_DT_PANIC_REGION=y（defconfig 里开着）下走设备树分支、找不到 pram 就直接返回，
# 不映射任何内存。官方 alioth 记的是同一件事（board.toml:196-198、configs/alioth_defconfig:12-19）。
# 本板的 panic 证据通道因此是 panic_screen=true 的屏上文本 + boot_progress_panic_text，
# 不是 RAM 里的 embedded-panic-log。
